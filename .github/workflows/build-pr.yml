name: Pull Request Verification

on:
  pull_request

jobs:

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Compile
      shell: cmd
      run: |
        MSBuild mini-ai.slnx /p:Configuration=Release /p:Platform=x64

    - name: Move files
      shell: cmd
      run: |
        move x64\Release\mini-ai.exe .\

    - name: Package
      uses: actions/upload-artifact@v4
      with:
        name: mini-ai
        path: |
          mini-ai.exe
          lib/llama/*.dll
          lib/stable-diffusion/*.dll