name: Nightly Build

on:
  schedule:
    - cron:  '0 0 * * *'

jobs:

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build
      shell: cmd
      run: |
        build.bat

    - name: Package
      uses: actions/upload-artifact@v4
      with:
        name: mini-ai
        path: |
          mini-ai.exe
          lib/llama/*.dll
          lib/stable-diffusion/*.dll

