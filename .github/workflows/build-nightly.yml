name: Nightly Build

on:
  schedule:
    - cron:  '0 0 * * *'

jobs:

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Initial compile
      shell: cmd
      run: |
        MSBuild mini-ai.slnx /p:Configuration=Release /p:Platform=x64

    - name: Move files
      shell: cmd
      run: |
        move x64\Release\mini-ai.exe .\
        move lib .\

    - name: Package
      uses: actions/upload-artifact@v4
      with:
        name: mini-ai
        path: |
          mini-ai.exe
          lib/

